name: Verify VoidFill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: TypeScript and application checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint

  database:
    name: PostgreSQL integrity and migration checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-ephemeral-password
          POSTGRES_USER: postgres
          POSTGRES_DB: voidfill_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-only-ephemeral-password@127.0.0.1:5432/voidfill_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.12'
      - run: python scripts/test-database.py --allow-test-database
      - name: Verify release checksum tracking and repeatable upgrades
        run: |
          node scripts/database.mjs upgrade --apply
          node scripts/database.mjs verify --apply
          node scripts/database.mjs upgrade --apply
      - name: Rehearse a synthetic database dump and restore
        env:
          POSTGRES_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: python scripts/test-database-restore.py --allow-test-database

  learning:
    name: Model, production build and isolated journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ML_BACKEND: onnx
      ML_SERVICE_URL: http://127.0.0.1:8010
      ML_SERVICE_TOKEN: ci-only-synthetic-learning-token-with-at-least-32-characters
      ML_ASSESSMENT_SECRET: ci-only-synthetic-assessment-secret-with-at-least-32-characters
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-only-public-placeholder
      DEMO_ENTRY_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DEMO_ADMIN_PASSWORD: ci-only-synthetic-admin
      DEMO_MENTOR_PASSWORD: ci-only-synthetic-mentor
      DEMO_MENTOR2_PASSWORD: ci-only-synthetic-mentor-two
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements-cloud.txt
      - run: npm ci
      - run: |
          python -m venv .venv-ml
          .venv-ml/bin/python -m pip install -r ml/requirements-cloud.txt pytest==9.1.1 Pillow==13.0.0
      - uses: actions/cache/restore@v4
        id: model-cache
        with:
          path: ml/artifacts/cloud
          key: model-${{ runner.os }}-${{ hashFiles('ml/cloud-release.json', 'ml/requirements-cloud.txt') }}
      - name: Fetch and verify public model artifacts and content fingerprints
        run: .venv-ml/bin/python -m ml.cloud_build
      - name: Save verified model before running tests
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ml/artifacts/cloud
          key: model-${{ runner.os }}-${{ hashFiles('ml/cloud-release.json', 'ml/requirements-cloud.txt') }}
      - name: Test the serving model, all career paths and isolated demo storage
        run: >-
          .venv-ml/bin/python -m pytest -q
          ml/tests/test_cloud_runtime.py ml/tests/test_cloud_build.py ml/tests/test_cloud_guests.py
          ml/tests/test_careers.py ml/tests/test_career_evaluation.py
          ml/tests/test_guest_resume.py ml/tests/test_staff_demo.py
          ml/tests/test_practical_demo.py
      - run: npm run build
      - name: Install Chromium for local UX checks
        run: npx playwright install --with-deps chromium
      - name: Start the production app and exercise learner/staff journeys
        shell: bash
        run: |
          npm start > /tmp/voidfill-ci-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --fail http://localhost:3000/ > /dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail http://localhost:3000/ > /dev/null
          npm run test:auth
          npm run test:demo
          npm run test:staff-demo
          npm run test:careers
          npm run test:practical
          npm run test:ux
      - name: Preserve isolated journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-journey-evidence
          path: |
            /tmp/voidfill-ci-server.log
            test-results/
          retention-days: 3
